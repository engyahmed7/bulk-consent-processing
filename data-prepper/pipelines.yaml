bulk-pipeline:
  workers: 2
  delay: 100
  source:
    http:
      port: 2021
      path: "/laravel/logs"
      ssl: false
  sink:
    - opensearch:
        hosts: ["https://opensearch:9200"]
        insecure: true
        username: admin
        password: "Developer@123"
        index_type: custom
        index: bulk-logs-%{yyyy.MM.dd}
